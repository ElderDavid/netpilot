# Compila la app Android, corre pruebas JVM y Lint.
# En main o al lanzarlo a mano (Actions › Android › Run workflow) publica el APK debug en la
# pre-release «android-debug» (Releases). No usa artefactos de Actions: la cuota de almacenamiento
# de la cuenta está llena y las releases no cuentan contra ella.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # solo para subir el APK a la release (no se usa en PR)
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Acepta las licencias del SDK de Android (necesario para compilar).
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, probar y Lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Publicar APK en la pre-release android-debug
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk netpilot-debug.apk
          notes="APK debug generado automáticamente desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). No firmado para tienda; no probado en hardware salvo que docs/estado.md diga lo contrario."
          if gh release view android-debug >/dev/null 2>&1; then
            gh release edit android-debug --notes "$notes"
          else
            gh release create android-debug --prerelease --title "Android debug (automático)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android-debug netpilot-debug.apk --clobber
