# Compila la app Android, corre pruebas JVM y Lint, y publica el APK debug como artefacto.
# Descarga: pestaña Actions › ejecución › Artifacts › netpilot-debug.apk (requiere sesión en GitHub).
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Acepta las licencias del SDK de Android (necesario para compilar).
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, probar y Lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/netpilot-debug.apk"

      # archive: false → se descarga directamente como .apk (no zip).
      - uses: actions/upload-artifact@v7
        with:
          path: netpilot-debug.apk
          archive: false
          retention-days: 14

      - name: Informes de pruebas y Lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
